<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <h1>Formulário</h1>
    <form action="http://127.0.0.1:5500/Atividades/Form.html?" method="get">
        <label for="nome">Nome:</label>
        <input name="nome" type="text" id="nome">
        <br>
        <label for="email">Email:</label>
        <input name="email" type="email" id="email">
        <br>
        <label for="senha">Senha:</label>
        <input name="senha" type="password" id="senha">
        <br>

        <h2>Escolha o Sabor:</h2>
        <input name="sabor" value="Cal" type="radio" id="sabor_Calabresa">
        <label for="sabor_Calabresa"> Calabresa - R$ 25,00 </label>
        <br>
        <input name="sabor" value="Mus" type="radio" id="sabor_Mussarela">
        <label for="sabor_Mussarela"> Mussarela - R$ 18,00 </label>
        <br>
        <input name="sabor" value="Port" type="radio" id="sabor_Portuguesa">
        <label for="sabor_Portuguesa"> Portuguesa - R$ 28,90 </label>
        <br>


       <h2>Escolha o Adicional:</h2>
        <input type="checkbox" name="adicional1" value="Milho"  id="adicional1">
        <label for="adicional1"> Milho - R$ 2,00 </label>
        <br>
        <input type="checkbox" name="adicional2" value="Queijo"  id="adicional2">
        <label for="adicional2"> Queijo - R$ 3,00 </label>
        <br>
        <input type="checkbox" name="adicional3" value="Milho"  id="adicional3">
        <label for="adicional3"> Azeitona - R$ 2,50 </label>
        <br>
        <input type="checkbox" name="adicional4" value="Borda_Catupiry"  id="adicional4">
        <label for="adicional4"> Borda Catupiry - R$ 15,00 </label>
        <br>
        <input type="checkbox" name="adicional5" value="Borda_Cheddar"  id="adicional5">
        <label for="adicional5"> Borda Cheddar - R$ 15,90 </label>
        <br>
        <br>

        <h2>Observação do Pedido:</h2>
        <label for="">Observação:</label>
        <br>
        <textarea cols="40" rows="4" maxlength="100" placeholder="Digite aqui" name="observacao"></textarea>
        <br>
        <br>
        
        <h2>Escolha o Tamanho da pizza:</h2>
        <label for="tipo"> Escolha o Tamanho da pizza:</label>
        <br>
        <select name="select" id="tipo" multiple size="2">
            <option value="-">Selecione o Tamanho</option>
            <option value="G">Grande (8 pedaços)</option>
            <option value="M">Média (6 pedaços)</option>
            <option value="P">Pequena (4 pedaços)</option>
        </select>

        <br>
        <h2>Escolha o Refrigerante:</h2>
        <label for="refri"> Escolha o Refrigerante:</label>
        <input list="Refrigerantes_lista">
        <br>
        <br>
        <datalist id="Refrigerantes_lista">
            <option value="Coca-cola Zero">Refrigerante zero açúcar</option>
            <option value="Guaraná">São Gerardo</option>
            <option value="Fanta">Sabor Uva</option>
        </datalist>

        <h2>Escolha uma cor:</h2>
        <input type="color" name="cor">

        <h2>Escolha uma data:</h2>
        <input type="date" name="datanasc">

        <h2>Escolha um número:</h2>
        <input type="number" name="quantidade" min="1" max="10">

        <input type="submit" value="Enviar">
        <br>

    </form>
    
</body>
</html>
