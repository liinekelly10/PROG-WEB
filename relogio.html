<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio-Umirim</title>
    <script>
        function horaAtual(){
            var html = document.getElementById("hora")
            html.innerHTML = Date()
        }
    </script>
</head>
<body>
    <h1 align="center">Hora Atual</h1>
    <h3 align="center" id="hora"></h3>
    <script>horaAtual()</script>
    
</body>
</html>
